name: play-release

# Builds the Google Play artifact (AAB) from the same tag as the sideload APK.
# Both channels share source and version, while release gates intentionally
# remove sideload-only monitoring and updater capabilities from the Play AAB.
#
# It deliberately does NOT upload to Play. The first submission must be done by
# hand in the Play Console to enrol in Play App Signing and complete the store
# listing; the AAB is published here as a workflow artifact to download.
#
# ACTION REQUIRED AT THAT FIRST SUBMISSION — it cannot be changed afterwards:
# choose "use an existing key" and upload THIS keystore as the app signing key,
# rather than letting Google generate one.
#
# Both channels ship the same applicationId (com.rabbaanie.app). Android refuses
# an update whose signature differs from the installed one, so if Google mints
# its own app signing key, Play-delivered installs and the sideload APKs built by
# release.yml end up signed by different keys under one package name. A user who
# installed from either channel then gets INSTALL_FAILED_UPDATE_INCOMPATIBLE from
# the other and has to uninstall first, losing local data and their session.
# Uploading the existing key keeps one signing identity across both channels.
#
# Trade-off being accepted: Google cannot reset a key it did not generate, so a
# lost keystore becomes unrecoverable. The keystore therefore needs a backup that
# does not live only on one laptop and in ANDROID_KEYSTORE_BASE64.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      APP_DISTRIBUTION: play
    # All actions SHA-pinned: a moved tag on a compromised action must not be
    # able to tamper with the bundle users install.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag format
        # Same bounds as release.yml: the versionCode formula
        # MAJOR*1000000 + MINOR*1000 + PATCH collides beyond 999, and leading
        # zeros would be parsed as octal by bash arithmetic.
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'; then
            echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (minor/patch 0-999, no leading zeros)" >&2
            exit 1
          fi

      - name: Derive version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Reads the pinned pnpm version from package.json's packageManager field
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      # oauth-login-flow pins the package name, which is permanent once published
      # — a rename must fail here rather than silently become a second Play app.
      - name: Verify
        run: |
          pnpm exec tsc --noEmit
          pnpm test:release

      - name: Verify Firebase client config
        run: |
          git ls-files --error-unmatch google-services.json >/dev/null
          node -e 'const c=require("./google-services.json"); const ok=c.client?.some(x=>x.client_info?.android_client_info?.package_name==="com.rabbaanie.app"); if(!ok) throw new Error("google-services.json does not contain com.rabbaanie.app")'

      # APP_DISTRIBUTION is pinned at job scope. The artifact checks below still
      # fail closed if config or a future dependency reintroduces a Play-only risk.
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      # Signed by Gradle rather than by jarsigner afterwards: Expo's generated
      # template signs release builds with the DEBUG keystore, and jarsigner
      # appends signatures instead of replacing them, so post-signing would
      # produce a two-signer bundle that Play rejects. Injected signing makes
      # Gradle use the real key in the first place.
      #
      # The passwords go through a 0600 properties file rather than -P flags:
      # -P lands them in the JVM command line, and /proc/<pid>/cmdline is
      # world-readable where /proc/<pid>/environ is not. Both the file and the
      # decrypted keystore are removed however this step exits.
      - name: Build and sign release bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/release.p12"
          GRADLE_PROPS="$HOME/.gradle/gradle.properties"
          BACKUP="$HOME/.gradle/gradle.properties.pre-signing"
          mkdir -p "$HOME/.gradle"
          if [ -f "$GRADLE_PROPS" ]; then cp "$GRADLE_PROPS" "$BACKUP"; fi

          cleanup() {
            rm -f "$KEYSTORE" "$GRADLE_PROPS"
            if [ -f "$BACKUP" ]; then mv "$BACKUP" "$GRADLE_PROPS"; fi
          }
          trap cleanup EXIT

          # Both the keystore and the properties file are created inside the
          # umask so neither lands group/world-readable.
          ( umask 077
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            {
              printf 'android.injected.signing.store.file=%s\n'     "$KEYSTORE"
              printf 'android.injected.signing.store.password=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'android.injected.signing.key.alias=%s\n'      "$ANDROID_KEY_ALIAS"
              printf 'android.injected.signing.key.password=%s\n'   "$ANDROID_KEY_PASSWORD"
            } > "$GRADLE_PROPS" )

          cd android
          ./gradlew bundleRelease --no-daemon

      # Hard gate. These are stripped by config (blockedPermissions emits
      # tools:node="remove"), but that only takes effect during the manifest
      # merge — and a future dependency can reintroduce any of them. So assert
      # against the MERGED manifest, which is what actually ships.
      - name: Assert Play-only restrictions
        run: |
          # Scoped to the release variant: an unscoped find could pick a debug
          # manifest and assert this hard gate against the wrong artifact.
          MERGED=$(find android/app/build/intermediates/merged_manifests/release \
                     -name AndroidManifest.xml | head -n1)
          if [ -z "$MERGED" ]; then
            echo "Could not locate the merged release manifest — refusing to ship unverified" >&2
            exit 1
          fi
          echo "Checking $MERGED"
          FAILED=0
          # Play forbids self-updating. The broad Rabbaanie Play listing also
          # cannot qualify as an exclusively marketed monitoring app, so Usage
          # Stats must be absent along with the unused sensitive permissions.
          for PERM in REQUEST_INSTALL_PACKAGES SYSTEM_ALERT_WINDOW RECORD_AUDIO PACKAGE_USAGE_STATS READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE USE_FULL_SCREEN_INTENT ACTIVITY_RECOGNITION; do
            if grep -q "android.permission.$PERM" "$MERGED"; then
              echo "FORBIDDEN: $PERM is present in the Play build" >&2
              FAILED=1
            fi
          done
          if grep -q 'android:name="isMonitoringTool"' "$MERGED"; then
            echo "FORBIDDEN: isMonitoringTool metadata is present in the Play build" >&2
            FAILED=1
          fi
          if grep -q 'android:scheme="rabbaanie"' "$MERGED"; then
            echo "FORBIDDEN: legacy Rabbaanie navigation scheme is present in the Play build" >&2
            FAILED=1
          fi
          # Native Google sign-in is certificate-bound and uses no redirect
          # scheme; a leftover auth scheme would mean a stale manifest.
          if grep -q 'android:scheme="com.rabbaanie.app.auth"' "$MERGED"; then
            echo "FORBIDDEN: retired OAuth callback scheme is present in the Play build" >&2
            FAILED=1
          fi
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          DEX_DUMP="$RUNNER_TEMP/rabbaanie-play-dex.bin"
          if ! unzip -p "$AAB" 'base/dex/*.dex' > "$DEX_DUMP"; then
            echo "Could not inspect Play bundle bytecode — refusing to ship unverified" >&2
            exit 1
          fi
          if grep -a -qE 'expo/modules/usagestats|UsageStatsModule' "$DEX_DUMP"; then
            echo "FORBIDDEN: native usage-stats monitoring code is present in the Play AAB" >&2
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          echo "Play permissions, deep links, and native modules are restricted."

      # `jarsigner -verify -strict` is deliberately NOT used: Android release
      # keystores are self-signed, which -strict reports as chainNotValidated
      # and turns into a non-zero exit on a perfectly valid bundle.
      - name: Verify signature
        env:
          # SHA-256 of the rabbaanie upload certificate (CN=Rabbaanie, O=Rabbaanie,
          # C=NL). Pinned so a wrong or rotated keystore fails here instead of
          # producing a bundle Play rejects — or worse, one Play accepts under a
          # signing identity that can never be reconciled with existing installs.
          EXPECTED_SHA256: "D8:1A:74:E9:72:03:8B:30:96:F7:A1:0B:81:17:44:A4:76:33:5F:98:CB:C5:BF:94:08:BA:23:3E:21:F3:5B:63"
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # No separate "is it signed at all" check — the certificate pin below
          # cannot pass on an unsigned bundle, so it already covers that case.
          # A second signer would mean the debug key slipped through; Play would
          # reject the upload with an unhelpful error, so catch it here instead.
          SIGNERS=$(unzip -l "$AAB" | grep -cE 'META-INF/.*\.(RSA|DSA|EC)$' || true)
          if [ "$SIGNERS" -ne 1 ]; then
            echo "Expected exactly 1 signer, found $SIGNERS" >&2
            exit 1
          fi
          if ! keytool -printcert -jarfile "$AAB" | grep -qF "SHA256: $EXPECTED_SHA256"; then
            echo "Bundle is not signed by the expected certificate:" >&2
            keytool -printcert -jarfile "$AAB" | grep "SHA256:" >&2
            exit 1
          fi
          cp "$AAB" "rabbaanie-v${APP_VERSION}.aab"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rabbaanie-play-aab
          path: rabbaanie-v*.aab
          if-no-files-found: error
          retention-days: 30
