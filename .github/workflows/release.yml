name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # All actions SHA-pinned: a moved tag on a compromised action must not be
    # able to tamper with the APK users install.
    env:
      # This is the sideload channel: it keeps the in-app APK updater and the
      # REQUEST_INSTALL_PACKAGES permission it needs. play-release.yml must NOT
      # set this (its default of "play" is what strips both).
      #
      # Job-level, NOT step-level. expo-constants registers a Gradle task that
      # re-executes app.config.ts on every build and bundles the result as the
      # `app.config` asset that Constants.expoConfig reads at runtime
      # (expo-constants/scripts/get-app-config-android.gradle: it is marked
      # outputs.upToDateWhen { false } and wired into preBuild). Setting this on
      # the prebuild step alone puts the permission in the manifest while the
      # Gradle step re-evaluates the config with DISTRIBUTION unset — shipping a
      # sideload APK whose updater is permanently dead.
      APP_DISTRIBUTION: github
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag format
        # Minor/patch bounded to 0-999 (the versionCode formula MAJOR*1000000 +
        # MINOR*1000 + PATCH collides beyond that) and leading zeros rejected
        # (bash arithmetic would parse them as octal).
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'; then
            echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (minor/patch 0-999, no leading zeros)" >&2
            exit 1
          fi

      - name: Derive version from tag
        # app.config.ts derives versionCode from APP_VERSION, so only the
        # version name is exported here.
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Reads the pinned pnpm version from package.json's packageManager field
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      # Gate the signed release on the updater logic: a regression in version
      # comparison or asset selection must not ship. Scoped to the updater
      # tests (the wider suite has pre-existing data-fixture failures).
      # oauth-login-flow pins the package name. A rename breaks upgrades on this
      # channel too — Android installs a changed package alongside the old app
      # instead of updating it — so both channels gate on it, not just Play.
      - name: Verify
        run: |
          pnpm exec tsc --noEmit
          pnpm test:release

      # Reads APP_VERSION / APP_VERSION_CODE and APP_DISTRIBUTION from the job env.
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the artifact
        # NOT re-signed with release.p12. Gradle already signed this APK with
        # the Expo/RN debug keystore (android/app/build.gradle wires
        # buildTypes.release to signingConfigs.debug), and that key — not the
        # release key — is the sideload channel's identity:
        #   * every sideload install in the wild carries it, and Android refuses
        #     an update signed by any other key (INSTALL_FAILED_UPDATE_INCOMPATIBLE);
        #   * the Android OAuth client is registered against its SHA-1, so an
        #     APK signed with anything else gets DEVELOPER_ERROR (code 10) on
        #     Google sign-in.
        # Signing this channel with release.p12 shipped exactly that pair of
        # failures as v1.4.83 on 2026-08-09. play-release.yml keeps release.p12
        # — that is the Play upload key and it belongs only there. Unifying the
        # two identities is possible but needs a v3 signing-lineage rotation
        # (apksigner rotate), never a bare key swap.
        run: cp android/app/build/outputs/apk/release/app-release.apk "rabbaanie-v${APP_VERSION}.apk"

      - name: Verify the sideload artifact (signer, channel, updater)
        run: ./scripts/assert-sideload-artifact.sh "rabbaanie-v${APP_VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: rabbaanie-v*.apk
          fail_on_unmatched_files: true
