name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # All actions SHA-pinned: a moved tag on a compromised action must not be
    # able to tamper with the APK users install.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag format
        # Minor/patch bounded to 0-999 (the versionCode formula MAJOR*1000000 +
        # MINOR*1000 + PATCH collides beyond that) and leading zeros rejected
        # (bash arithmetic would parse them as octal).
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'; then
            echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (minor/patch 0-999, no leading zeros)" >&2
            exit 1
          fi

      - name: Derive version from tag
        # app.config.ts derives versionCode from APP_VERSION, so only the
        # version name is exported here.
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Reads the pinned pnpm version from package.json's packageManager field
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      # Gate the signed release on the updater logic: a regression in version
      # comparison or asset selection must not ship. Scoped to the updater
      # tests (the wider suite has pre-existing data-fixture failures).
      - name: Verify
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run lib/app-version.test.ts

      # Reads APP_VERSION / APP_VERSION_CODE from env via app.config.ts
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Delete the decrypted keystore no matter how this step exits.
          trap 'rm -f release.p12' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.p12
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.p12 --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "rabbaanie-v${APP_VERSION}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          # After v1.2.0 ships, pin the expected signer here so a wrong/rotated
          # keystore fails the build instead of publishing a non-upgradable APK:
          #   "$BUILD_TOOLS/apksigner" verify --print-certs "rabbaanie-v${APP_VERSION}.apk" | grep -q "SHA-256 digest: <fingerprint>"
          "$BUILD_TOOLS/apksigner" verify --print-certs "rabbaanie-v${APP_VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: rabbaanie-v*.apk
          fail_on_unmatched_files: true
